<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Replies · Marketing team</title>
    <meta name="description" content="Prepared replies to customers' availability questions, drafted by LangGraph from the latest shelf visits." />
    <link rel="icon" href="/seed/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      try {
        const t = localStorage.getItem('replies.theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <nav class="nav" aria-label="Main">
      <div class="nav-inner">
        <div class="nav-links">
          <a class="brand icon" href="#overview" title="Replies" aria-label="Replies">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12Z" /><path d="M8.5 11h7M8.5 14h4.5" /></svg>
          </a>
          <a href="#overview" data-nav="overview">Overview</a>
          <a href="#posts" data-nav="posts">Posts</a>
          <a href="#data" data-nav="data">Data</a>
          <a href="#health" data-nav="health">Health</a>
          <a href="#how" data-nav="how">How it works</a>
          <a href="#setup" data-nav="setup">Setup</a>
        </div>
        <div class="nav-tools">
          <button class="icon" id="btn-search" title="Search comments" aria-label="Search comments">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4.5 4.5" /></svg>
          </button>
          <button class="icon" id="btn-sound" title="Sound for new comments" aria-label="Sound for new comments">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z" /><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18 7a7 7 0 0 1 0 10" /></svg>
          </button>
          <button class="icon" id="btn-theme" title="Dark mode" aria-label="Dark mode">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" /></svg>
          </button>
        </div>
      </div>
      <div class="nav-search" id="search-panel"><input id="search" type="search" placeholder="Search comments, names or replies" autocomplete="off" /></div>
    </nav>
    <div class="ribbon" id="ribbon"><span class="dot"></span><span id="ribbon-text">Connecting…</span></div>
    <main id="app" class="wrap"></main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/app.js" defer></script>
  </body>
</html>
